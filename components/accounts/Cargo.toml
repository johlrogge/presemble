[package]
name = "accounts"
version = "0.35.0"
edition = "2024"

[package.metadata.polylith]
interface = "accounts"

[dependencies]
axum = { workspace = true }
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
