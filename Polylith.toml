[workspace]
schema_version = 1

[libraries]
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
notify = "7"
pulldown-cmark = "0.12"
quick-xml = { version = "0.36", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
nng = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "process", "fs", "time"] }
tower-lsp = "0.20"
im = "15"
rayon = "1.10"
thiserror = "2"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
ratatui = "0.29"
crossterm = "0.28"
async-trait = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1"] }
http-body-util = "0.1"

[profiles]
dev = "profiles/dev.profile"
live = "profiles/live.profile"

[versioning]
policy = "relaxed"
version = "0.35.1"
