#cloud-config
# First-boot configuration for the presemble conductor box.
# Idempotent: re-running (fresh instance) converges to the same state.

package_update: true
package_upgrade: true

packages:
  - unattended-upgrades        # preinstalled on Debian cloud image; explicit here
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - curl
  - gnupg

write_files:
  # Disable root SSH — the `debian` user has sudo.
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PermitRootLogin no

  # Automatic security updates (the low-maintenance win).
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  # systemd unit for the presemble live-edit server. `presemble serve` auto-spawns
  # the conductor daemon as a child (systemd's cgroup manages both). The binary at
  # /usr/local/bin/presemble and the site at /var/lib/presemble/site are delivered
  # by the deploy step (just conductor-deploy / CI), so the unit may fail-restart
  # until the first deploy lands — expected.
  - path: /etc/systemd/system/presemble.service
    content: |
      [Unit]
      Description=Presemble live-edit server (browser editing + conductor)
      After=network.target

      [Service]
      Type=simple
      User=presemble
      Group=presemble
      WorkingDirectory=/var/lib/presemble
      Environment=XDG_RUNTIME_DIR=/run/presemble
      RuntimeDirectory=presemble
      ExecStart=/usr/local/bin/presemble serve /var/lib/presemble/site --url-style relative
      StandardInput=null
      Restart=on-failure
      RestartSec=5
      # Hardening — the service only needs to write under its state dir.
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      ReadWritePaths=/var/lib/presemble

      [Install]
      WantedBy=multi-user.target

# NOTE: the Caddyfile is intentionally NOT in write_files. Pre-creating
# /etc/caddy/Caddyfile before the package is installed triggers a dpkg conffile
# prompt during `apt install caddy`, which aborts the postinst that creates the
# `caddy` system user (service then fails with status=217/USER). So: install
# caddy first (clean), then drop our config in runcmd.
runcmd:
  - systemctl reload ssh
  # Caddy is not in Debian repos; use the official cloudsmith apt repo.
  - curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/gpg.key | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt > /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update -qq
  - DEBIAN_FRONTEND=noninteractive apt-get install -y caddy
  # Now that /etc/caddy exists and the caddy user is created, write our config.
  - |
    cat > /etc/caddy/Caddyfile <<'CADDY'
    # conductor.presemble.pub — Caddy obtains and auto-renews a real Let's Encrypt
    # certificate via the HTTP-01 challenge (port 80 is open and DNS resolves to
    # this box). No ACME token lives here; renewal is fully on-box and continuous.
    #
    # Stopgap access control: HTTP basic_auth gates the live-edit UI (the /_presemble
    # editing endpoints must never be open to the public). The bcrypt hash is injected
    # by Tofu templatefile from a local secret — it is NOT in the repo. Real per-user
    # control is the M11 milestone. Backend is the presemble serve HTTP listener.
    conductor.presemble.pub {
        basic_auth {
            editor ${caddy_editor_hash}
        }
        reverse_proxy 127.0.0.1:3000
    }
    CADDY
  - systemctl enable --now caddy
  - systemctl reload caddy
  # presemble service account + state dir. The binary (/usr/local/bin/presemble)
  # and site (/var/lib/presemble/site) are delivered by the deploy step, so the
  # unit fail-restarts until the first deploy — expected. Enable it for boot.
  - id presemble >/dev/null 2>&1 || useradd --system --home-dir /var/lib/presemble --create-home --shell /usr/sbin/nologin presemble
  - mkdir -p /var/lib/presemble/site
  - chown -R presemble:presemble /var/lib/presemble
  - systemctl daemon-reload
  - systemctl enable presemble
